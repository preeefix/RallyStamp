name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter gen-l10n

      # Generated sources (freezed, json_serializable, drift, l10n) are not
      # committed, so they are built here before anything analyses the code.
      - run: dart run build_runner build --delete-conflicting-outputs

      # Only checked-in sources; generated output is formatted by its generator.
      - run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      - run: flutter analyze

      - run: flutter test

      - run: dart run tool/build_web.dart
